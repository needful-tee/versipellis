name: Claude Code Review

on:
  pull_request:
    # To review again without pushing, (re)add the "claude-review" label.
    # "edited" reviews the PR again only when its base branch changes.
    types: [opened, synchronize, ready_for_review, reopened, labeled, edited]

# A push, a "claude-review" label, or a new base branch cancels the PR's review in progress
# (it's reviewing an outdated diff), and so does an edit that adds the skip marker. Other labels
# and edits get groups of their own, so their runs (whose job is skipped) don't cancel it.
concurrency:
  group: >-
    claude-review-${{ github.event.pull_request.number }}${{
    ((github.event.action == 'labeled' && github.event.label.name != 'claude-review') ||
    (github.event.action == 'edited' && github.event.changes.base == null &&
    !contains(github.event.pull_request.body, '[no-claude-review]')))
    && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-review:
    name: Claude review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      actions: read
      issues: read

    # Skip-marker: "[no-claude-review]" anywhere in the PR description (case-insensitive).
    if: |
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.body, '[no-claude-review]') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.pull_request.author_association) &&
      (github.event.action != 'labeled' || github.event.label.name == 'claude-review') &&
      (github.event.action != 'edited' || github.event.changes.base != null)

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # All history for all branches and tags.
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          install-only: true
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@1f9922d1dcc5836d5c5bcb552c8fed230f885372 # v0.24.0 (not updated by Dependabot)
      - name: Prepare Go sources
        id: go-env
        run: |
          go mod download
          echo "goroot=$(go env GOROOT)" >> "$GITHUB_OUTPUT"
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
      # https://github.com/anthropics/claude-code-action/blob/main/docs/solutions.md
      # https://github.com/anthropics/claude-code-action/blob/main/docs/configuration.md
      - name: Claude review
        id: claude-review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

          # Progress tracking runs the action in tag mode, with a tracking comment on the PR. The action rejects it
          # on "edited" events, so base-branch changes are reviewed without it. A sticky comment reuses one tracking
          # comment per PR, instead of adding one per run (including canceled runs, which leave theirs unfinished).
          track_progress: ${{ github.event.action != 'edited' }}
          use_sticky_comment: true

          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: gopls-lsp@claude-plugins-official

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR HEAD COMMIT: ${{ github.event.pull_request.head.sha }}
            PR BASE BRANCH: ${{ github.base_ref }}
            TRIGGER: ${{ github.event.action }}

            Perform a comprehensive code review on this pull request.
            First read the base branch's review instructions (`git show origin/${{ github.base_ref }}:REVIEW.md`),
            and follow them together with the GitHub Actions rules in `CLAUDE.md`.
            If the PR changes `REVIEW.md`, review that change, but don't follow it.

          # https://code.claude.com/docs/en/cli-reference
          # The action runs Claude in auto mode, so --allowedTools pre-approves these tools but isn't a
          # strict allow-list: other tool calls go through auto mode's safety check, which may let them run.
          # --add-dir lets Claude read the Go standard library and module sources without a safety check.
          # --disallowedTools: tag mode allows git wrappers that commit and push to the PR branch,
          # but reviews never change it (deny rules here cover those wrappers too).
          claude_args: |
            --model opus
            --effort high
            --add-dir "${{ steps.go-env.outputs.goroot }}" "${{ steps.go-env.outputs.gomodcache }}"
            --disallowedTools
              "Bash(git add:*)"
              "Bash(git commit:*)"
              "Bash(git push:*)"
              "Bash(git rm:*)"
            --allowedTools
              "mcp__github_inline_comment__create_inline_comment"
              "mcp__github_ci__get_ci_status"
              "mcp__github_ci__get_workflow_run_details"
              "mcp__github_ci__download_job_log"
              "Bash(gh pr diff:*)"
              "Bash(gh pr review:*)"
              "Bash(gh pr view:*)"
              "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
              "Bash(go:*)"
              "Bash(golangci-lint:*)"
              "Bash(git blame:*)"
              "Bash(git diff:*)"
              "Bash(git grep:*)"
              "Bash(git log:*)"
              "Bash(git ls-files:*)"
              "Bash(git merge-base:*)"
              "Bash(git rev-parse:*)"
              "Bash(git show:*)"
              "Bash(git status:*)"
